[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-agent-control"
version = "0.1.0"
description = "Self-hosted Telegram Bot API control plane for AI agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx[socks]>=0.28,<1", "pydantic-settings>=2.7,<3", "jsonschema>=4.23,<5", "python-multipart>=0.0.20,<1", "croniter>=6,<7", "pillow>=11,<13", "mcp>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "beautifulsoup4>=4.12,<5"]
emoji = ["lottie==0.7.2", "cairosvg>=2.7,<3"]
[project.scripts]
tac = "tac.cli:main"
[tool.setuptools.package-data]
tac = ["data/*.json", "static/*"]
[tool.setuptools.packages.find]
include = ["tac*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
