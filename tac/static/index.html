<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Telegram Agent Control</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/workspace.css" />
    <script defer src="/static/app.js"></script>
    <script defer src="/static/control.js"></script>
    <script defer src="/static/assistant.js"></script>
    <script defer src="/static/workspace.js"></script>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#10171c">
    <meta name="apple-mobile-web-app-capable" content="yes">
  </head>
  <body>
    <aside>
      <a class="brand" href="/"
        >↗ <span>TELEGRAM<br /><b>AGENT CONTROL</b></span></a
      >
      <div class="workspace">CONTROL PLANE <span>v0.4</span></div>
      <button id="chat-nav-toggle" aria-expanded="false" aria-controls="nav">فهرست مدیریت</button>
      <nav id="nav" aria-label="Workspace sections">
        <button data-view="overview" class="active">◉ Overview</button
        ><button data-view="operations">↗ Operations</button
        ><button data-view="compose">＋ Compose</button
        ><button data-view="automations">⌁ Automations</button
        ><button data-view="emojis">✧ Emoji studio</button
        ><button data-view="methods">⌘ API explorer</button
        ><button data-view="logs">≡ Activity & logs</button
        ><button data-view="database">▤ Database</button>
        <button data-view="channels">↗ Channels</button>
        <button data-view="media">▣ Media library</button>
        <button data-view="keyboards">⌨ Keyboards</button>
        <button data-view="connections">☁ Connect an AI / اتصال هوش مصنوعی</button>
        <button data-view="agents">⚿ Agent permissions</button>
        <button data-view="diagnostics">◈ Health & metrics</button>
        <button data-view="settings">⚙ Settings</button>
        <button data-view="maintenance">✓ Maintenance approvals</button>
        <details class="legacy-nav"><summary>ابزارهای اختیاری</summary><button data-view="assistant">گفتگوی داخلی قدیمی</button></details>
      </nav>
      <div class="aside-foot">
        <span id="connection">● Disconnected</span
        ><button id="disconnect">Disconnect</button
        ><a href="/docs" target="_blank">REST documentation ↗</a>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <div class="eyebrow">SELF-HOSTED • API FIRST</div>
          <h1 id="title">Overview</h1>
        </div>
        <div class="top-actions">
          <button id="refresh">↻ Refresh</button
          ><button id="pause" class="danger">Pause execution</button>
        </div>
      </header>
      <section id="login" class="card">
        <h2>Sign in / ورود</h2>
        <p>Use the username and password chosen during setup. / با نام کاربری و رمز اولیه وارد شوید.</p>
        <form id="password-form">
          <label for="username">Username / نام کاربری</label>
          <input id="username" autocomplete="username" required maxlength="120">
          <label for="password">Password / رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
          <button class="primary">Sign in / ورود</button>
        </form>
        <details><summary>Advanced: access key / ورود با کلید</summary>
          <form id="login-form">
            <input aria-label="Access credential" id="key" type="password" placeholder="Access key" autocomplete="off" required>
            <button>Connect with key</button>
          </form>
        </details>
      </section>
      <div id="notice" role="status" hidden></div>
      <div id="content" hidden></div>
      <dialog id="detail">
        <div class="dialog-top">
          <h2>Operation details</h2>
          <button id="close-detail">Close</button>
        </div>
        <div id="detail-body"></div>
      </dialog>
    </main>
  </body>
</html>
